name: Quality

# Enforces the quality gate across the whole TS codebase — the daemon (src/) and
# the frontend (web/): the opinionated ESLint set (eslint.config.js) at
# --max-warnings 0, strict TypeScript typecheck (both tsconfig projects), and a
# clean production web build.
#
# ESLint errors AND warnings block (--max-warnings 0). Biome's repo-wide lint is
# NOT run here yet — it has a large pre-existing backlog tracked separately.

on:
  # No path filter: `eslint .` now covers the whole repo (ts/tsx/js/mjs/html/css),
  # so the gate must run on any PR — a stale path list would silently skip newly
  # covered dirs (shared/, scripts/, tests/, skills/, *.css, *.html).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  web-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # All implementation + config lives in errandd/ (root is plugin-dist only).
    defaults:
      run:
        working-directory: errandd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint (opinionated React/TS gate)
        run: bun run lint:eslint

      - name: Typecheck
        run: bun run typecheck

      - name: Build web bundle
        run: bun run build:web

  # The plugin ships as a git checkout (marketplace source `./`) with dist/ and
  # node_modules/ gitignored, so production builds the UI at daemon boot from
  # sources alone. This job runs that exact path — `build:web:ensure`, no prior
  # `bun install` — on a pristine checkout, so a release can't ship a tree whose
  # UI won't build. web-quality above can't catch it: it installs deps first.
  ui-builds-from-pristine-checkout:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: errandd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build the UI the way the daemon does at boot
        run: bun run build:web:ensure
